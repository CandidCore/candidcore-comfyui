name: build-candidcore-comfyui

# Builds the image on GitHub's x86 runners (linux/amd64, the architecture RunPod uses) and pushes it to GHCR.
# Runs on every push to main and by hand from the Actions tab.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # A CUDA + torch image is about 15 GB: free the runner's disk first.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image names must be lowercase, whatever capitals the account name has.
      - name: Read version and owner
        id: version
        run: |
          echo "v=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.version.outputs.owner }}/candidcore-comfyui:latest
            ghcr.io/${{ steps.version.outputs.owner }}/candidcore-comfyui:${{ steps.version.outputs.v }}
